[package]
name = "seshbuddy"
version = "0.1.0"
description = "AI Coding Agents Session Explorer & Desktop Companion"
authors = ["huangy"]
edition = "2021"

[lib]
name = "seshbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
dirs = "6"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
transcript-store = { path = "../transcript-store" }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-rolling-file = { version = "0.1", features = ["non-blocking"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
regex = "1"
nanoid = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }
notify = "6"
toml = "0.8"
sha2 = "0.10"
semver = "1"
base64 = "0.22"
portable-pty = "0.8"
git2 = { version = "0.19", features = ["vendored-openssl"] }
tauri-plugin-single-instance = "2.4.1"
flate2 = "1"
zstd = "0.13"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
time = { version = "0.3", features = ["formatting"] }
url = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
thiserror = "2"
tantivy = "0.22"
sys-locale = "0.3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
interprocess = "2"

[dev-dependencies]
anyhow = "1"
tempfile = "3"
